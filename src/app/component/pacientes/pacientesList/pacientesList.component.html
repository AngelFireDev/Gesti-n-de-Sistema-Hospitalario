<div class="container mt-4">
  <h2 class="text-primary">Lista de Pacientes</h2>

  <div class="d-flex justify-content-end mb-3">
    <button class="btn btn-sucess" (click)="crearPaciente()">
      <i class="bi bi-person-plus me-2"></i> Crear Paciente
    </button>
  </div>

  <table class="table table-striped mt-3">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Diagnóstico</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let paciente of pacientes">
        <td>{{ paciente.id }}</td>
        <td>{{ paciente.nombre }}</td>
        <td>{{ paciente.edad }}</td>
        <td>{{ paciente.diagnostico }}</td>
        <td>
          <div class="dropdown">
            <button class="btn btn-light btn-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-three-dots-vertical"></i>
            </button>
            <ul class="dropdown-menu">
              <li>
                <a class="dropdown-item d-flex align-items-center" (click)="editarPaciente(paciente)">
                  <i class="bi bi-pencil-square me-2 text-primary"></i> Editar
                </a>
              </li>
              <li>
                <a class="dropdown-item d-flex align-items-center text-danger" (click)="eliminarPaciente(paciente.id)">
                  <i class="bi bi-trash me-2"></i> Eliminar
                </a>
              </li>
            </ul>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
  
</div>
