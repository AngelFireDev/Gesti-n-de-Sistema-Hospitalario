<div class="container mt-4">
  <h2 class="text-primary">Crear Paciente</h2>

  <form [formGroup]="form" class="row g-3 mt-3">

    <div class="col-md-6">
      <label for="documento" class="form-label">Documento</label>
      <input type="number" id="documento" class="form-control" formControlName="documento">
    </div>

    <div class="col-md-6">
      <label for="nombre" class="form-label">Nombre</label>
      <input type="text" id="nombre" class="form-control" formControlName="nombre">
    </div>

    <div class="col-md-6">
      <label for="apellido" class="form-label">Apellido</label>
      <input type="text" id="apellido" class="form-control" formControlName="apellido">
    </div>

    <div class="col-md-3">
      <label for="fecha_nacimiento" class="form-label">Fecha Nacimiento</label>
      <input type="date" id="fecha_nacimiento" class="form-control" formControlName="fecha_nacimiento">
    </div>

    <div class="col-md-3">
      <label for="genero" class="form-label">Genero</label>
      <input type="text" id="genero" class="form-control" formControlName="genero">
    </div>

    <div class="col-md-3">
      <label for="telefono" class="form-label">Telefono</label>
      <input type="text" id="telefono" class="form-control" formControlName="telefono">
    </div>

    <div class="col-md-3">
      <label for="direccion" class="form-label">Dirección</label>
      <input type="text" id="direccion" class="form-control" formControlName="direccion">
    </div>

    <div class="col-md-3">
      <label for="email" class="form-label">Email</label>
      <input type="text" id="email" class="form-control" formControlName="email">
    </div>

    <div class="col-md-3">
      <label for="tipo_sangre" class="form-label">Tipo Sangre</label>
      <input type="text" id="tipo_sangre" class="form-control" formControlName="tipo_sangre">
    </div>



    <div class="col-12 d-flex justify-content-end mt-3">
      <button type="submit" class="btn btn-success me-2" (click)="guardarPaciente()">
        <i class="bi bi-check-circle me-1"></i> Guardar
      </button>
      <button type="button" class="btn btn-danger" (click)="cancelar()">
        <i class="bi bi-x-circle me-1"></i> Cancelar
      </button>
    </div>
  </form>
</div>
