<div class="container mt-5 d-flex justify-content-center">
  <div class="card shadow-lg p-4" style="width: 400px;">
    <h3 class="text-center text-primary mb-4">Registro</h3>

    <form [formGroup]="form" (ngSubmit)="guardarUsuario()">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre</label>
        <input type="text" id="nombre" class="form-control" formControlName="nombre" placeholder="Ingrese su nombre">
      </div>

      <div class="mb-3">
        <label for="apellido" class="form-label">Apellido</label>
        <input type="text" id="apellido" class="form-control" formControlName="apellido" placeholder="Ingrese su apellido">
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="text" id="email" class="form-control" formControlName="email" placeholder="Ingrese su correo">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" id="password" class="form-control" formControlName="password" placeholder="Ingrese su contraseña">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Confirmación Contraseña</label>
        <input type="password" id="password" class="form-control" formControlName="password" placeholder="Ingrese su contraseña nuevamente">
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
          <i class="bi bi-box-arrow-in-right me-2"></i> Registrarse
        </button>
      </div>
    </form>

    <div class="mt-3 text-center">
      <a href="/login" class="text-decoration-none">Volver al Login</a>
    </div>
  </div>
</div>
